<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWC - Android Webcam Client</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
            }
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer base {
      body {
        @apply bg-[#0f172a] text-slate-200 antialiased h-screen overflow-hidden;
      }
    }
    .glass {
      @apply bg-slate-900/50 backdrop-blur-xl border border-slate-700/50;
    }
    .video-glow {
      box-shadow: 0 0 50px -12px rgba(99, 102, 241, 0.3);
    }
  </style>
  <style>
    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background-color: #334155; /* tailwind slate-700 */
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background-color: #475569; /* tailwind slate-600 */
    }
    ::-webkit-scrollbar-corner {
      background: transparent;
    }
  </style>
</head>
<body>

  <div class="flex h-full">
    <aside class="w-80 glass border-r border-slate-800 p-6 flex flex-col gap-6 z-10 overflow-y-auto">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-brand-500 rounded-xl flex items-center justify-center shadow-lg shadow-brand-500/20">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
        </div>
        <h1 class="text-xl font-bold tracking-tight text-white">AWC <span class="text-[10px] font-medium px-2 py-0.5 bg-slate-800 rounded-full text-slate-400 align-middle ml-1">v1.0.3</span></h1>
      </div>

      <hr class="border-slate-800">

      <div class="space-y-4">
        <div class="space-y-2">
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Connection URL</label>
          <input type="text" id="serverUrl" value="http://localhost:8080/video" 
                 class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-500 outline-none transition-all">
        </div>

        <div class="grid grid-cols-1 gap-2">
          <button id="toggleConnectBtn" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-semibold py-2.5 rounded-lg transition-all active:scale-95 flex items-center justify-center gap-2">
            <span id="toggleConnectBtnText">Connect Device</span>
          </button>
        </div>
      </div>

      <div id="cameraControls" class="hidden space-y-4 pt-2 border-t border-slate-800">
        <div class="flex items-center justify-between">
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Camera Controls</label>
          <button id="refreshSettingsBtn" class="text-xs text-brand-400 hover:text-brand-300 transition-colors flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Sync
          </button>
        </div>
        
        <button id="flipBtn" class="w-full border border-slate-700 hover:border-brand-500/50 hover:bg-brand-500/10 text-slate-300 py-2 rounded-lg text-sm transition-all flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span id="flipBtnText">Flip Camera</span>
        </button>

        <div class="space-y-1.5">
          <div class="flex justify-between items-center">
            <span class="text-[10px] text-slate-500 font-bold uppercase">Resolution</span>
            <span id="currentResolution" class="text-[9px] text-brand-400 font-mono">Loading...</span>
          </div>
          <select id="resSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-300 outline-none focus:ring-1 focus:ring-brand-500">
            <option value="">Loading...</option>
          </select>
        </div>

        <div id="focusContainer" class="space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-[10px] text-slate-500 font-bold uppercase">Focus Mode</span>
            <select id="focusMode" class="bg-transparent text-[10px] text-brand-400 font-bold outline-none cursor-pointer">
              <option value="0" class="bg-slate-900">AUTO</option>
              <option value="2" class="bg-slate-900" id="manualFocusOption">MANUAL</option>
            </select>
          </div>
          <p id="focusSupportMsg" class="text-[9px] text-emerald-400 hidden">Manual focus supported</p>
          <div id="manualFocusCont" class="hidden space-y-1">
            <div class="flex justify-between items-center mb-1">
              <span class="text-[9px] text-slate-500">Distance</span>
              <span id="focusDistValue" class="text-[9px] text-brand-400 font-mono">500</span>
            </div>
            <input type="range" id="focusDist" min="0" max="1000" value="500" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-brand-500 disabled:opacity-30 disabled:cursor-not-allowed">
            <div class="flex justify-between text-[8px] text-slate-500 uppercase">
              <span>Infinity</span>
              <span>Macro</span>
            </div>
          </div>
        </div>

        <div id="exposureContainer" class="space-y-2 pt-2 border-t border-slate-800/50">
          <div class="flex justify-between items-center mb-1">
            <span class="text-[10px] text-slate-500 font-bold uppercase">Exposure</span>
            <span id="exposureValue" class="text-[9px] text-brand-400 font-mono">0</span>
          </div>
          <input type="range" id="exposureSlider" min="0" max="0" value="0" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-brand-500 disabled:opacity-30 disabled:cursor-not-allowed">
          <div class="flex justify-between text-[8px] text-slate-500 uppercase">
            <span>Darker</span>
            <span>Brighter</span>
          </div>
        </div>
      </div>

      <div class="space-y-3 pt-2 border-t border-slate-800">
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Tools</label>
        <button id="virtualCamBtn" disabled class="w-full border border-slate-700 hover:border-emerald-500/50 hover:bg-emerald-500/10 text-slate-300 py-2 rounded-lg text-sm transition-all flex items-center justify-center gap-2 disabled:opacity-30">
          Virtual Camera
        </button>
        <button id="popoutBtn" disabled class="w-full border border-slate-700 hover:border-brand-500/50 hover:bg-brand-500/10 text-slate-300 py-2 rounded-lg text-sm transition-all disabled:opacity-30">
          Pop-out Feed
        </button>
      </div>

      <div class="mt-auto p-4 bg-slate-900/80 rounded-xl border border-slate-800/50 shrink-0">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs text-slate-500">Status</span>
          <span id="modeIndicator" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-700 text-slate-300 uppercase">Standby</span>
        </div>
        <div id="status" class="text-sm font-medium text-slate-400 italic">Ready to connect...</div>
      </div>
    </aside>

    <main class="flex-1 relative flex flex-col bg-[#020617]">
      <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -right-24 w-96 h-96 bg-brand-600/10 rounded-full blur-[120px]"></div>
        <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-emerald-600/5 rounded-full blur-[120px]"></div>
      </div>

      <div class="flex-1 flex items-center justify-center p-8">
        <div id="placeholder" class="max-w-md text-center space-y-6">
          <div class="w-20 h-20 bg-slate-800/50 rounded-3xl mx-auto flex items-center justify-center border border-slate-700">
            <svg class="w-10 h-10 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" /></svg>
          </div>
          <div>
            <h2 class="text-2xl font-bold text-white mb-2">Connect Your Stream</h2>
            <p class="text-slate-400 text-sm leading-relaxed">Toggle your phone's webcam server and enter the URL in the sidebar.</p>
          </div>
        </div>

        <div id="videoStreamDiv" class="hidden relative w-full h-full flex items-center justify-center">
            <img id="videoStream" class="hidden max-w-full max-h-full rounded-2xl border border-slate-700/50 video-glow object-contain transition-all duration-500" alt="Stream">
        </div>
      </div>
      
      <div id="toast" class="absolute bottom-6 right-6 px-6 py-3 rounded-xl glass border-brand-500/30 text-sm font-medium translate-y-20 opacity-0 transition-all duration-300 pointer-events-none"></div>
    </main>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    
    // UI Elements
    const videoStream = document.getElementById('videoStream');
    const videoStreamDiv = document.getElementById('videoStreamDiv');
    const placeholder = document.getElementById('placeholder');
    const toggleConnectBtn = document.getElementById('toggleConnectBtn');
    const toggleConnectBtnText = document.getElementById('toggleConnectBtnText');
    const popoutBtn = document.getElementById('popoutBtn');
    const virtualCamBtn = document.getElementById('virtualCamBtn');
    const serverUrlInput = document.getElementById('serverUrl');
    const statusDiv = document.getElementById('status');
    const modeIndicator = document.getElementById('modeIndicator');
    const toastDiv = document.getElementById('toast');

    // Camera Control Elements
    const cameraControls = document.getElementById('cameraControls');
    const flipBtn = document.getElementById('flipBtn');
    const flipBtnText = document.getElementById('flipBtnText');
    const resSelect = document.getElementById('resSelect');
    const currentResolution = document.getElementById('currentResolution');
    const focusContainer = document.getElementById('focusContainer');
    const focusMode = document.getElementById('focusMode');
    const focusDist = document.getElementById('focusDist');
    const focusDistValue = document.getElementById('focusDistValue');
    const manualFocusCont = document.getElementById('manualFocusCont');
    const manualFocusOption = document.getElementById('manualFocusOption');
    const focusSupportMsg = document.getElementById('focusSupportMsg');
    
    // Exposure Elements
    const exposureSlider = document.getElementById('exposureSlider');
    const exposureValue = document.getElementById('exposureValue');
    const refreshSettingsBtn = document.getElementById('refreshSettingsBtn');
    
    let isConnected = false;
    let virtualCamActive = false;
    let isFrontCamera = false;
    let deviceFeatures = null;
    let deviceSettings = null;
    let syncInterval = null;

    // Button Styling Constants
    const BTN_CONNECT_STYLE = "w-full bg-brand-500 hover:bg-brand-600 text-white font-semibold py-2.5 rounded-lg transition-all active:scale-95 flex items-center justify-center gap-2";
    const BTN_DISCONNECT_STYLE = "w-full bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 text-red-400 font-semibold py-2.5 rounded-lg transition-all active:scale-95 flex items-center justify-center gap-2";

    // --- Helper Functions ---

    function showToast(message, isError = false) {
      toastDiv.textContent = message;
      toastDiv.classList.remove('translate-y-20', 'opacity-0', 'border-red-500/30', 'border-brand-500/30');
      toastDiv.classList.add(isError ? 'border-red-500/30' : 'border-brand-500/30');
      setTimeout(() => toastDiv.classList.add('translate-y-20', 'opacity-0'), 3000);
    }

    function updateStatus(message, state = 'idle') {
      statusDiv.textContent = message;
      const colors = { idle: 'text-slate-400', active: 'text-emerald-400', error: 'text-red-400' };
      statusDiv.className = `text-sm font-medium italic ${colors[state]}`;
    }

    function getBaseUrl() {
        try {
            const url = new URL(serverUrlInput.value);
            return `${url.protocol}//${url.host}`;
        } catch(e) {
            return null;
        }
    }

    async function sendControl(query) {
        const base = getBaseUrl();
        if (!base) return;
        try {
            const response = await fetch(`${base}/control?${query}`);
            if (response.ok) {
                showToast('✓ Command sent');
                setTimeout(fetchSettings, 500);
            }
        } catch (err) {
            console.error('Control failed', err);
            showToast('Command failed', true);
        }
    }

    async function fetchFeatures() {
        const base = getBaseUrl();
        if (!base) return;
        
        try {
            const response = await fetch(`${base}/features`);
            if (!response.ok) throw new Error('Failed to fetch features');
            
            deviceFeatures = await response.json();
            
            // Populate resolutions
            resSelect.innerHTML = '';
            deviceFeatures.resolutions.forEach((res) => {
                const option = document.createElement('option');
                option.value = res;
                option.textContent = res;
                resSelect.appendChild(option);
            });
            
            // Focus Support UI
            focusSupportMsg.classList.remove('hidden');
            if (deviceFeatures.manual_focus) {
                focusSupportMsg.textContent = "Manual focus supported";
                focusSupportMsg.className = "text-[9px] text-emerald-400 mb-1";
                focusDist.disabled = false;
                manualFocusOption.disabled = false;
            } else {
                focusSupportMsg.textContent = "Fixed focus camera";
                focusSupportMsg.className = "text-[9px] text-red-400 mb-1";
                focusDist.disabled = true;
                manualFocusOption.disabled = true;
                focusMode.value = "0"; // Force auto
            }

            // Exposure Support UI
            if (deviceFeatures.exposure_lower !== undefined && deviceFeatures.exposure_upper !== undefined) {
                if (deviceFeatures.exposure_lower !== deviceFeatures.exposure_upper) {
                    exposureSlider.min = deviceFeatures.exposure_lower;
                    exposureSlider.max = deviceFeatures.exposure_upper;
                    exposureSlider.disabled = false;
                } else {
                    exposureSlider.disabled = true;
                }
            }
            
            isFrontCamera = (deviceFeatures.camera === 'front');
            updateFlipButtonText(deviceFeatures.camera);
            
        } catch (err) {
            console.error('Failed to fetch features:', err);
            showToast('Could not load device features', true);
        }
    }

    async function fetchSettings() {
        const base = getBaseUrl();
        if (!base) return;
        
        try {
            const response = await fetch(`${base}/settings`);
            if (!response.ok) throw new Error('Failed to fetch settings');
            
            deviceSettings = await response.json();
            syncUIWithSettings();
        } catch (err) {
            console.error('Failed to fetch settings:', err);
        }
    }

    function syncUIWithSettings() {
        if (!deviceSettings || !deviceFeatures) return;
        
        // Sync Resolution
        currentResolution.textContent = deviceSettings.resolution_str;
        if (deviceFeatures.resolutions.includes(deviceSettings.resolution_str)) {
            resSelect.value = deviceSettings.resolution_str;
        }
        
        // Sync Focus
        focusMode.value = deviceSettings.focus_mode.toString();
        if (deviceSettings.focus_mode === 2) {
            manualFocusCont.classList.remove('hidden');
            focusDist.value = deviceSettings.focus_distance;
            focusDistValue.textContent = deviceSettings.focus_distance;
        } else {
            manualFocusCont.classList.add('hidden');
        }

        // Sync Exposure
        if (deviceSettings.exposure_index !== undefined) {
            exposureSlider.value = deviceSettings.exposure_index;
            exposureValue.textContent = deviceSettings.exposure_index;
        }
    }

    function updateFlipButtonText(camera) {
        if (camera === 'front') {
            flipBtnText.textContent = 'Switch to Back';
        } else {
            flipBtnText.textContent = 'Switch to Front';
        }
    }

    async function initializeDeviceSync() {
        await fetchFeatures();
        await fetchSettings();
        syncInterval = setInterval(fetchSettings, 5000); // Polling
    }

    // --- Main Connection Flow ---

    toggleConnectBtn.addEventListener('click', () => {
        if (isConnected) disconnect();
        else connect();
    });

    function connect() {
      const url = serverUrlInput.value.trim();
      if (!url) return showToast('Enter a URL first', true);

      updateStatus('Connecting...', 'idle');
      videoStream.src = url + '?t=' + Date.now();
      
      toggleConnectBtn.disabled = true;
      toggleConnectBtnText.textContent = "Connecting...";

      videoStream.onload = async () => {
        isConnected = true;
        placeholder.classList.add('hidden');
        videoStream.classList.remove('hidden');
        videoStreamDiv.classList.remove('hidden');
        
        toggleConnectBtn.disabled = false;
        toggleConnectBtn.className = BTN_DISCONNECT_STYLE;
        toggleConnectBtnText.textContent = "Disconnect";

        popoutBtn.disabled = false;
        virtualCamBtn.disabled = false;
        serverUrlInput.disabled = true;

        cameraControls.classList.remove('hidden');

        modeIndicator.textContent = 'Streaming';
        modeIndicator.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 uppercase';
        updateStatus('Feed Live', 'active');

        await initializeDeviceSync();
      };

      videoStream.onerror = () => {
        updateStatus('Connection failed', 'error');
        disconnect();
      };
    }

    function disconnect() {
      isConnected = false;
      videoStream.src = '';
      videoStream.classList.add('hidden');
      videoStreamDiv.classList.add('hidden');
      placeholder.classList.remove('hidden');
      
      toggleConnectBtn.disabled = false;
      toggleConnectBtn.className = BTN_CONNECT_STYLE;
      toggleConnectBtnText.textContent = "Connect Device";

      popoutBtn.disabled = true;
      virtualCamBtn.disabled = true;
      serverUrlInput.disabled = false;

      cameraControls.classList.add('hidden');

      if (syncInterval) {
        clearInterval(syncInterval);
        syncInterval = null;
      }

      modeIndicator.textContent = 'Standby';
      modeIndicator.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-700 text-slate-300 uppercase';
      updateStatus('Disconnected', 'idle');
      
      if (virtualCamActive) ipcRenderer.send('stop-virtual-camera');
      ipcRenderer.send('close-feed-window');
    }

    // --- Hardware Control Events ---

    flipBtn.addEventListener('click', () => {
        isFrontCamera = !isFrontCamera;
        sendControl(`flip=${isFrontCamera}`);
        updateFlipButtonText(isFrontCamera ? 'front' : 'back');
    });

    resSelect.addEventListener('change', (e) => {
        sendControl(`resolution_str=${encodeURIComponent(e.target.value)}`);
    });

    focusMode.addEventListener('change', (e) => {
        const mode = e.target.value;
        manualFocusCont.classList.toggle('hidden', mode !== '2');
        sendControl(`focus_mode=${mode}`);
    });

    let focusTimeout;
    focusDist.addEventListener('input', (e) => {
        focusDistValue.textContent = e.target.value;
        clearTimeout(focusTimeout);
        focusTimeout = setTimeout(() => {
            sendControl(`focus_mode=2&focus_distance=${e.target.value}`);
        }, 100);
    });

    let exposureTimeout;
    exposureSlider.addEventListener('input', (e) => {
        exposureValue.textContent = e.target.value;
        clearTimeout(exposureTimeout);
        exposureTimeout = setTimeout(() => {
            sendControl(`exposure_index=${e.target.value}`);
        }, 100);
    });

    refreshSettingsBtn.addEventListener('click', () => {
        fetchSettings();
        showToast('Syncing settings...');
    });

    // --- Software Tool Events ---

    popoutBtn.addEventListener('click', () => {
      ipcRenderer.send('open-feed-window', serverUrlInput.value.trim());
    });

    virtualCamBtn.addEventListener('click', () => {
      if (!virtualCamActive) {
        virtualCamBtn.disabled = true;
        updateStatus('Starting Virtual Cam...', 'idle');
        ipcRenderer.send('start-virtual-camera', serverUrlInput.value.trim());
      } else {
        ipcRenderer.send('stop-virtual-camera');
      }
    });

    ipcRenderer.on('virtual-camera-status', (event, data) => {
      virtualCamBtn.disabled = false;
      if (data.success) {
        virtualCamActive = data.message.includes('started');
        virtualCamBtn.textContent = virtualCamActive ? 'Stop Virtual Cam' : 'Virtual Camera';
        virtualCamBtn.classList.toggle('bg-red-500/10', virtualCamActive);
        virtualCamBtn.classList.toggle('text-red-400', virtualCamActive);
        showToast(data.message);
      } else {
        showToast(data.message, true);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'f') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
