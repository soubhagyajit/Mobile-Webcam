<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Installing Components</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5' }
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer base {
      body {
        @apply bg-[#0f172a] text-slate-200 antialiased h-screen flex items-center justify-center overflow-hidden;
      }
    }
    .glass-panel {
      @apply bg-slate-900/50 backdrop-blur-2xl shadow-2xl;
    }
    .custom-loader {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: conic-gradient(#0000 10%, #6366f1);
      -webkit-mask: radial-gradient(farthest-side, #0000 calc(100% - 8px), #000 0);
      animation: s3 1s infinite linear;
    }
    @keyframes s3 { to { transform: rotate(1turn) } }
    
    /* Smooth Scrollbar for Logs */
    #log::-webkit-scrollbar { width: 4px; }
    #log::-webkit-scrollbar-track { background: transparent; }
    #log::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
  </style>
</head>
<body>

  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-brand-600/10 rounded-full blur-[100px]"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-emerald-600/10 rounded-full blur-[100px]"></div>
  </div>

  <div class="container relative z-10 w-[450px] p-8 glass-panel rounded-[2rem]">
    
    <div id="headerArea" class="text-center mb-8">
      <h1 class="text-2xl font-bold text-white mb-2 tracking-tight">Setting Up Components</h1>
      <p class="text-slate-400 text-sm">Preparing your virtual camera drivers...</p>
    </div>

    <div class="flex flex-col items-center justify-center mb-8 h-24">
      <div id="spinner" class="custom-loader"></div>
      
      <div id="successIcon" class="hidden scale-0 transition-transform duration-500">
        <div class="w-16 h-16 bg-emerald-500/20 rounded-full flex items-center justify-center border border-emerald-500/50">
          <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </div>
      </div>

      <div id="errorIcon" class="hidden scale-0 transition-transform duration-500">
        <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center border border-red-500/50">
          <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
        </div>
      </div>
    </div>

    <div class="space-y-4">
      <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
        <div id="progressBar" class="bg-gradient-to-r from-brand-500 to-emerald-500 h-full w-0 transition-all duration-500 ease-out"></div>
      </div>
      
      <div id="status" class="text-center text-sm font-medium text-slate-300">
        Initializing engine...
      </div>
    </div>

    <div id="logWrapper" class="hidden mt-6 overflow-hidden transition-all duration-500">
      <div id="log" class="bg-black/40 border border-slate-800 rounded-xl p-4 h-32 overflow-y-auto font-mono text-[10px] text-slate-500 space-y-1">
        </div>
    </div>

    <button id="closeButton" class="hidden w-full mt-6 py-3 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl transition-all active:scale-95">
      Close Installer
    </button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const progressBar = document.getElementById('progressBar');
    const status = document.getElementById('status');
    const spinner = document.getElementById('spinner');
    const successIcon = document.getElementById('successIcon');
    const errorIcon = document.getElementById('errorIcon');
    const closeButton = document.getElementById('closeButton');
    const log = document.getElementById('log');
    const logWrapper = document.getElementById('logWrapper');

    function addLog(message, isError = false) {
      const entry = document.createElement('div');
      const time = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
      entry.className = isError ? 'text-red-400' : '';
      entry.innerHTML = `<span class="text-slate-600">[${time}]</span> ${message}`;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    function updateProgress(message, percent) {
      status.textContent = message;
      progressBar.style.width = `${percent}%`;
      addLog(message);
    }

    ipcRenderer.on('install-progress', (event, data) => {
      updateProgress(data.message, data.percent);
    });

    ipcRenderer.on('install-complete', (event, data) => {
      spinner.classList.add('hidden');
      logWrapper.classList.remove('hidden');
      
      if (data.success) {
        successIcon.classList.remove('hidden');
        setTimeout(() => successIcon.classList.remove('scale-0'), 10);
        status.textContent = 'Ready for action!';
        status.className = "text-center text-sm font-bold text-emerald-400";
        progressBar.style.width = '100%';
        addLog('Deployment successful.');
      } else {
        errorIcon.classList.remove('hidden');
        setTimeout(() => errorIcon.classList.remove('scale-0'), 10);
        status.textContent = 'Installation Failed';
        status.className = "text-center text-sm font-bold text-red-400";
        data.errors.forEach(err => addLog(`CRITICAL: ${err.step} - ${err.error}`, true));
      }
      
      closeButton.classList.remove('hidden');
    });

    closeButton.addEventListener('click', () => window.close());

    // Start installation
    ipcRenderer.send('start-auto-install');
  </script>
</body>
</html>
